name: smart_steps_tracker
description: "Smart Steps Tracker - a free and open-source step counter with Material 3 design."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # State management (MVVM view-models)
  flutter_riverpod: ^2.5.1

  # Charts
  fl_chart: ^0.69.0

  # Step counting & background work
  pedometer: ^4.2.0
  workmanager: ^0.10.10
  permission_handler: ^11.3.1

  # Local persistence
  sqflite: ^2.4.1
  shared_preferences: ^2.3.2
  path: ^1.9.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Backup / sharing
  csv: ^6.0.0
  share_plus: ^10.1.2
  file_picker: ^8.1.2
  path_provider: ^2.1.4

  # Notifications need the IANA zone name for scheduling
  flutter_timezone: ^5.1.1

  # UI helpers
  intl: ^0.19.0
  confetti: ^0.7.0
  table_calendar: ^3.1.3
  dynamic_color: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
